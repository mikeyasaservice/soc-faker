[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-faker"
version = "4.0.2"
description = "A Python package to fake SOC (Security Operations Center) data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "Swimlane", email = "info@swimlane.com"}]
keywords = ["faker", "soc", "security", "swimlane"]
dependencies = [
  "requests>=2.32,<3",
  "pendulum>=3.1,<4",
  "beautifulsoup4>=4.12,<5",
  "xmltodict>=0.14,<2",
  "netaddr>=1.3,<2",
  "fire>=0.7,<1",
  "lorem-text>=2.1,<4",
  "lxml>=5.3,<7",
]

[project.urls]
Repository = "https://github.com/mikeyasaservice/soc-faker"

[project.scripts]
soc-faker = "socfaker.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10", "coverage>=7,<8", "twine>=6,<7"]

[tool.setuptools.packages.find]
include = ["socfaker*"]

[tool.setuptools.package-data]
socfaker = ["data/*.txt", "data/*.csv", "data/*.json", "data/filenames/*.txt", "data/sysmon/*.txt", "data/windows-event/*.md"]
